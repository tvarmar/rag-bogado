[project]
name = "rag-bogado"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tania Évora Vargas Martínez", email = "tvarmar.contacto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
rag-bogado = "rag_bogado:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
