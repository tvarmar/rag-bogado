services:
  rag-bogado-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-bogado-api
    ports:
      - "8000:8000"
    environment:
      - CATALOG_PATH=/app/data/catalog/catalog.sqlite3
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - HF_HOME=/app/data/cache/huggingface
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data/catalog:/app/data/catalog
      - ./data/cache:/app/data/cache
    depends_on:
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: rag-bogado-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -f http://localhost:6333/readyz || wget -q -O - http://localhost:6333/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped
